[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "team-project-farmin-ai"
version = "0.1.0"
description = "A smart farming assistant"
requires-python = ">=3.10"
authors = [
  { name = "Chenna Keshava", email = "you@example.com" }
]
maintainers = [
  { name = "Team Farmin AI", email = "maintainer@example.com" }
]
readme = "README.md"
license = { text = "AGPL-3.0" }
keywords = ["farming", "ai", "streamlit", "agriculture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

# Core dependencies
dependencies = [
  "streamlit",
  "speechrecognition",
  "sounddevice",
  "tensorflow",
  "tensorboard",
  "requests-oauthlib",
  "validators",
  "rich",
  "toml",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "black"
]
cli = [
  "click",
  "rich"
]

[project.urls]
Homepage = "https://github.com/yourusername/team-project-farmin-ai"
Repository = "https://github.com/yourusername/team-project-farmin-ai.git"
"Bug Tracker" = "https://github.com/yourusername/team-project-farmin-ai/issues"
Changelog = "https://github.com/yourusername/team-project-farmin-ai/blob/main/CHANGELOG.md"

[project.scripts]
farmin-cli = "farmin:main"

[project.gui-scripts]
farmin-gui = "farmin:main_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/farmin"]
